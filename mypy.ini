[mypy]
python_version = 3.12
files = main, tools

# These packages ship no type information (no py.typed marker, no stubs on
# PyPI), so mypy cannot see into them. Qiskit in particular returns backend and
# circuit objects whose attributes are resolved at runtime. Ignoring them here
# is scoped per-package rather than global, so a genuine typo in a first-party
# import still fails.
#
# qiskit_ibm_runtime is additionally an optional dependency -- the local
# simulator arms run without it -- so it may not be installed at all.

[mypy-qiskit.*]
ignore_missing_imports = True

[mypy-qiskit_aer.*]
ignore_missing_imports = True

[mypy-qiskit_ibm_runtime.*]
ignore_missing_imports = True

[mypy-qiskit_machine_learning.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True
